services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Override in production: at least 32 random characters.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-docker-signing-key-change-me-0123456789}
      Cors__Origins__0: http://localhost:5173
    volumes:
      - bullion-data:/data

volumes:
  bullion-data:
